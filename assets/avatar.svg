<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="44" height="44" role="img" aria-label="Astronaut avatar">
  <defs>
    <linearGradient id="av-bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1b3763"/>
      <stop offset="1" stop-color="#0a1627"/>
    </linearGradient>
    <radialGradient id="av-halo" cx="0.5" cy="0.44" r="0.62">
      <stop offset="0" stop-color="#5fe0ff" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#5fe0ff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="av-shell" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f4f8ff"/>
      <stop offset="1" stop-color="#c3d2ea"/>
    </linearGradient>
    <linearGradient id="av-visor" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4fd0ff"/>
      <stop offset="0.5" stop-color="#1a6fae"/>
      <stop offset="1" stop-color="#0a2238"/>
    </linearGradient>
  </defs>

  <!-- space tile + glow -->
  <rect width="64" height="64" fill="url(#av-bg)"/>
  <ellipse cx="32" cy="28" rx="30" ry="26" fill="url(#av-halo)"/>

  <!-- stars -->
  <g fill="#dff2ff">
    <circle cx="10" cy="12" r="1.1" opacity="0.8"/>
    <circle cx="54" cy="16" r="1" opacity="0.7"/>
    <circle cx="51" cy="47" r="0.9" opacity="0.6"/>
    <circle cx="12" cy="45" r="0.8" opacity="0.6"/>
  </g>

  <!-- helmet shell -->
  <rect x="13" y="11" width="38" height="42" rx="17" fill="url(#av-shell)"/>
  <!-- side connectors -->
  <rect x="9"  y="26" width="6" height="12" rx="3" fill="#aebdd6"/>
  <rect x="49" y="26" width="6" height="12" rx="3" fill="#aebdd6"/>
  <!-- antenna -->
  <rect x="31" y="4" width="2" height="7" rx="1" fill="#9fb0cc"/>
  <circle cx="32" cy="4" r="2.2" fill="#4fd0ff"/>

  <!-- visor housing -->
  <rect x="16.5" y="18" width="31" height="27" rx="13.5" fill="#0c1a2e"/>
  <!-- visor glass -->
  <rect x="18.5" y="20" width="27" height="23" rx="11.5" fill="url(#av-visor)"/>
  <!-- rim glow -->
  <rect x="18.5" y="20" width="27" height="23" rx="11.5" fill="none" stroke="#7fe6ff" stroke-width="1" opacity="0.6"/>
  <!-- glare streaks -->
  <g fill="#eafaff" opacity="0.5">
    <rect x="22" y="23" width="4" height="12" rx="2" transform="rotate(22 24 29)"/>
    <rect x="28.5" y="24" width="2" height="9" rx="1" transform="rotate(22 29.5 28.5)"/>
  </g>
  <!-- reflected star glint -->
  <circle cx="39.5" cy="38" r="1.1" fill="#ffffff" opacity="0.85"/>
</svg>
